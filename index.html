<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rogue Realms V4.8</title>
<link rel="stylesheet" href="style.css?v=48">
</head>
<body>
<main class="game">
<header class="topbar">
  <h1>ROGUE REALMS <small>V4.8</small></h1>
  <div class="hud">
    <span>Nivel <b id="level">1</b></span>
    <span>XP <b id="xp">0</b>/<b id="xpNext">50</b></span>
    <span>Fuerza <b id="power">0</b></span>
    <span class="rageHud">🔥 Furia <b id="rage">0</b>/<b id="maxRageHud">100</b></span>
  </div>
</header>

<section id="mapScreen" class="screen">
  <div class="forestScene">
    <div class="forestShade"></div>
    <div class="forestTop">
      <div class="sectionTitle">BOSQUE OLVIDADO</div>
      <p class="hint">Tres caminos se abren ante ti. ¿Cuál eliges?</p>
    </div>

    <div class="routes" id="map"></div>
    <div class="routeGlow leftGlow"></div>
    <div class="routeGlow centerGlow"></div>
    <div class="routeGlow rightGlow"></div>
    <img class="backWarrior" src="assets/characters/warrior-back.svg" alt="Guerrero de espaldas">
  </div>
</section>

<section id="battleScreen" class="screen hidden">
  <div class="battle">
    <div class="battleTitle">COMBATE</div>
    <div class="battleHint" id="battleHint">Tu turno.</div>
    <div class="arena">
      <div class="fighter playerFighter">
        <img id="playerImg" src="assets/characters/warrior.svg" alt="Guerrero">
        <h2>GUERRERO</h2>
        <div class="bar hpbar"><i id="playerHpBar"></i></div>
        <small id="playerHpText"></small>
        <div class="resourceLabel"><span>🔥 FURIA</span><b id="playerRageText">0 / 100</b></div>
        <div class="bar ragebar"><i id="playerRageBar"></i></div>
      </div>
      <div class="vs">VS</div>
      <div class="fighter">
        <img id="enemyImg" alt="Enemigo">
        <h2 id="enemyName">ENEMIGO</h2>
        <div class="bar enemybar"><i id="enemyHpBar"></i></div>
        <small id="enemyHpText"></small>
      </div>
    </div>
    <div id="log" class="log">Tu turno.</div>
    <div id="attacks" class="attacks" aria-label="Ataques"></div>
  </div>
</section>

<section id="rewardScreen" class="screen hidden">
  <div class="panel reward">
    <div id="rewardTitle" class="sectionTitle">RECOMPENSA</div>
    <p id="rewardSubtitle">Elige una mejora.</p>
    <div id="rewards" class="rewardGrid"></div>
  </div>
</section>
</main>
<script src="src/game.js?v=48"></script>
</body>
</html>
